name: Update CR Cup live status

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-live-status.yml'
      - 'scripts/update_live_status.mjs'
      - 'crcup_streams_v2.json'
      - 'crcup_coach_streams_v2.json'
  schedule:
    # 2026/10/1-4 09:00-01:55 JST = UTC 00:00-16:55, every 5 minutes.
    - cron: '*/5 0-16 1-4 10 *'

permissions:
  contents: write

concurrency:
  group: crcup-live-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check event year
        id: datecheck
        shell: bash
        run: |
          if [ "$(date -u +%Y)" = "2026" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check YouTube and Twitch
        if: steps.datecheck.outputs.run == 'true'
        run: node scripts/update_live_status.mjs

      - name: Commit live status
        if: steps.datecheck.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- live-status.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-status.json
          git commit -m "Update CR Cup live status"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
