name: Update CR Cup live status

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-live-status.yml'
      - 'scripts/update_live_status.mjs'
      - 'crcup_streams_v2.json'
      - 'crcup_coach_streams_v2.json'
  schedule:
    # Keep the cron simple for GitHub's scheduler. The job itself gates by JST date/time.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: crcup-live-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check event window
        id: datecheck
        shell: bash
        run: |
          NOW_YEAR="$(TZ=Asia/Tokyo date +%Y)"
          NOW_MONTH="$(TZ=Asia/Tokyo date +%m)"
          NOW_DAY="$(TZ=Asia/Tokyo date +%d)"
          NOW_HOUR="$(TZ=Asia/Tokyo date +%H)"

          # CR Cup APEX #11: 2026-10-01 through 2026-10-04.
          # Run from 08:00 JST through 01:59 JST the following morning.
          RUN=false
          if [ "$NOW_YEAR" = "2026" ] && [ "$NOW_MONTH" = "10" ]; then
            DAY=$((10#$NOW_DAY))
            HOUR=$((10#$NOW_HOUR))
            if [ "$DAY" -ge 1 ] && [ "$DAY" -le 4 ]; then
              RUN=true
            elif [ "$DAY" -eq 5 ] && [ "$HOUR" -lt 2 ]; then
              RUN=true
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "JST now: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S %Z') / run=$RUN"

      - name: Check YouTube and Twitch
        if: steps.datecheck.outputs.run == 'true'
        run: node scripts/update_live_status.mjs

      - name: Commit live status
        if: steps.datecheck.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- live-status.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-status.json
          git commit -m "Update CR Cup live status"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
